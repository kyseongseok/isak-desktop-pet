<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>이삭이 미니게임</title>
<link rel="stylesheet" href="../pang/style.css">
<style>
  #menu { background: url('../runner/img/bg_spring.jpg') center / cover no-repeat; }
  #menu::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,.18); }
  .title-box { top: 40px; }
  .title { font-size: 46px; }
  .list { position: absolute; left: 36px; right: 36px; top: 228px; display: flex; flex-direction: column; gap: 14px; }
  .game {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; cursor: pointer; text-align: left;
    background: #fffbe6; border: 3px solid #2b3a2e; box-shadow: 4px 4px 0 #2b3a2e; font-family: 'Galmuri11', sans-serif; color: #2b3a2e;
  }
  .game:hover, .game.sel { background: #fff3c4; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #2b3a2e; }
  .game:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #2b3a2e; }
  .game .ic { font-size: 32px; width: 44px; text-align: center; }
  .game .ic img { width: 52px; height: 52px; margin: -6px -4px; vertical-align: middle; }
  .game .ic img.flip { transform: scaleX(-1); }
  .game .nm { font-family: 'Galmuri14'; font-size: 20px; }
  .game .ds { font-size: 12px; color: #556; margin-top: 3px; }
  .game .bs { margin-left: auto; font-size: 12px; color: #1d6b53; white-space: nowrap; }
  .foot { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; color: #2b3a2e; }
  .foot span { background: rgba(255,251,230,.85); padding: 3px 10px; border: 2px solid #2b3a2e; }
  .coins { position: absolute; top: 190px; left: 0; right: 0; text-align: center; font-size: 14px; }
  .coins span { background: #fffbe6; border: 2px solid #2b3a2e; padding: 3px 10px; }
  .coins:empty { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="screen on" id="menu">
    <div class="title-box">
      <div class="title">이삭이<br>미니게임</div>
      <div class="subtitle">ISAK ARCADE</div>
    </div>
    <div class="coins" id="coins"></div>
    <div class="list" id="list"></div>
    <div class="foot"><span>↑ ↓ 로 고르고 Enter · 마우스로 눌러도 돼요</span></div>
  </div>
  <button id="x" title="닫기">×</button>
</div>
<script src="menu.js"></script>
</body>
</html>
