<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이삭이 움직임 미리보기</title>
<style>
  :root {
    --taskbar-h: 44px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #3a7bd5 0%, #6aa8e8 45%, #a8d0f0 100%);
  }
  /* 가짜 바탕화면 아이콘 */
  .icon {
    position: absolute; width: 76px; text-align: center; color: #fff;
    font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .icon .glyph {
    width: 48px; height: 48px; margin: 0 auto 4px; border-radius: 8px;
    background: rgba(255,255,255,.85); display: grid; place-items: center; font-size: 26px;
  }
  .icon.hit { animation: iconHit .35s ease-out; }
  @keyframes iconHit {
    0% { transform: scale(1); } 30% { transform: scale(.85) rotate(-6deg); }
    60% { transform: scale(1.08) rotate(4deg); } 100% { transform: scale(1); }
  }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--taskbar-h);
    background: rgba(20, 24, 32, .85); backdrop-filter: blur(8px);
    display: flex; align-items: center; padding: 0 12px; gap: 8px; color: #ddd; font-size: 13px;
  }
  .taskbar .clock { margin-left: auto; }

  /* 컨트롤 패널 */
  .panel {
    position: absolute; top: 12px; right: 12px; width: 260px; z-index: 50;
    background: rgba(255,255,255,.95); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 13px; color: #222;
  }
  .panel h1 { font-size: 15px; margin: 0 0 6px; }
  .panel p { margin: 0 0 10px; color: #555; line-height: 1.45; }
  .panel .group { margin-top: 10px; font-weight: 600; font-size: 12px; color: #2a8c6e; }
  .panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .panel button {
    border: 1px solid #cfe9df; background: #effaf5; color: #1d6b53; border-radius: 8px;
    padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .panel button:hover { background: #d9f3e8; }
  .panel .toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; }

  /* 펫 */
  #pet {
    position: absolute; left: 0; top: 0; width: 220px; height: 220px;
    cursor: grab; z-index: 20; touch-action: none;
  }
  #pet.dragging { cursor: grabbing; }
  /* 크기 조정 모드 */
  #pet.resizing { cursor: default; }
  /* 이미지 여백을 빼고 캐릭터 몸에 맞춘 점선 테두리 */
  #pet.resizing::before {
    content: ""; position: absolute; left: 20%; right: 20%; top: 7%; bottom: 3%;
    border: 2px dashed rgba(255,255,255,.95); border-radius: 14px; pointer-events: none;
  }
  #pet .handle {
    position: absolute; right: calc(20% - 12px); top: calc(7% - 12px); width: 24px; height: 24px; border-radius: 50%;
    background: #2a8c6e; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    cursor: nesw-resize; display: none;
  }
  #pet.resizing .handle { display: block; }
  /* 우클릭 메뉴 */
  #ctxMenu {
    position: absolute; z-index: 60; display: none; min-width: 170px; padding: 6px;
    background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.22); font-size: 13px;
  }
  #ctxMenu button {
    display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; color: #223;
  }
  #ctxMenu button:hover { background: #effaf5; }
  #ctxMenu hr { border: 0; border-top: 1px solid #eee; margin: 4px 2px; }
  #pet img {
    width: 100%; height: 100%; display: block; pointer-events: none;
    transform-origin: 50% 95%;
  }
  #shadow {
    position: absolute; width: 121px; height: 18px; border-radius: 50%; transform-origin: 50% 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.28), rgba(0,0,0,0) 70%);
    z-index: 19; pointer-events: none;
  }
  /* 말풍선 */
  #bubble {
    position: absolute; z-index: 55; max-width: 240px; padding: 10px 14px;
    background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
    font-size: 14px; color: #1e3d33; line-height: 1.4; display: none;
    transform: translate(-50%, -100%);
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  #bubble.alarm { background: #fff3f0; color: #b3261e; font-weight: 700; }
  #bubble.alarm::after { border-top-color: #fff3f0; }
  #bubble .choices { display: flex; gap: 6px; margin-top: 8px; }
  #bubble .choices button {
    flex: 1; border: 0; border-radius: 8px; padding: 6px 0; cursor: pointer;
    background: #2a8c6e; color: #fff; font-family: inherit; font-size: 13px;
  }
  #bubble .choices button.secondary { background: #e4ece9; color: #345; }
  #bubble input[type=time] {
    display: block; width: 100%; margin-top: 8px; padding: 6px 8px; font-size: 15px;
    border: 1px solid #cfe9df; border-radius: 8px; font-family: inherit;
  }
</style>
</head>
<body>

<div class="icon" style="left:16px; top:16px"><div class="glyph">📁</div>업무자료</div>
<div class="icon" style="left:16px; top:110px"><div class="glyph">📄</div>보고서.hwp</div>
<div class="icon" style="left:16px; top:204px"><div class="glyph">🗑️</div>휴지통</div>
<div class="icon" style="left:110px; top:16px"><div class="glyph">📊</div>예산.xlsx</div>
<div class="icon" style="left:30%; top:34%"><div class="glyph">🧪</div>실험노트</div>
<div class="icon" style="left:58%; top:62%"><div class="glyph">📚</div>지식보관소</div>
<div class="icon" style="left:24%; top:55%"><div class="glyph">📅</div>출장일정</div>

<div class="panel">
  <h1>🌾 이삭이 움직임 미리보기</h1>
  <p>클릭하면 말랑, 끌어서 던지면 튕겨요. 가만두면 혼자 걷거나 딴짓을 해요.</p>

  <div class="group">초과근무 시뮬레이션 <span id="simClock" style="color:#333;font-weight:700"></span></div>
  <div id="otStatus" style="margin-top:4px;font-size:12px;color:#555;line-height:1.5"></div>
  <div class="btns">
    <button data-sim="to1754">17:54로 이동</button>
    <button data-sim="toAlarm">마감 6분 전으로</button>
    <button data-sim="away">자리 비움 후 복귀</button>
  </div>
  <div class="btns">
    <span style="font-size:12px;color:#777;align-self:center">시계 속도</span>
    <button data-speed="1">×1</button>
    <button data-speed="60">×60</button>
    <button data-speed="300">×300</button>
  </div>

  <div class="group">감정 / 이벤트</div>
  <div class="btns">
    <button data-act="hello">인사</button>
    <button data-act="cheer">코인 획득</button>
    <button data-act="care">케어 메시지</button>
    <button data-act="sleep">졸음</button>
    <button data-act="curious">궁금해</button>
    <button data-act="watch">지켜보고 있다</button>
  </div>

  <div class="group">딴짓</div>
  <div class="btns">
    <button data-act="walk">걷기</button>
    <button data-act="research">연구</button>
    <button data-act="farm">농사</button>
    <button data-act="produce">농산물</button>
  </div>

  <div class="group">크기 <span id="sizeLabel" style="color:#888;font-weight:400"></span></div>
  <input type="range" id="sizeSlider" min="100" max="360" step="10" style="width:100%">
  <div class="btns">
    <button data-size="140">작게</button>
    <button data-size="220">보통</button>
    <button data-size="300">크게</button>
  </div>
  <p style="margin:6px 0 0;font-size:11px;color:#888">이삭이 우클릭 → 크기 조정으로도 바꿀 수 있어요</p>

  <label class="toggle"><input type="checkbox" id="autoplay" checked> 자동 행동 (걷기, 딴짓, 졸기)</label>
</div>

<div id="shadow"></div>
<div id="pet"><img id="petImg" alt="이삭이"><div class="handle" title="끌어서 크기 조정"></div></div>
<div id="bubble"></div>
<div id="ctxMenu">
  <button data-menu="resize">📏 크기 조정</button>
  <hr>
  <button data-menu="checked" data-ot="active">⏰ 근무확인 눌렀어요</button>
  <button data-menu="fixtime" data-ot="active">✏️ 누른 시각 고치기</button>
  <button data-menu="exclude" data-ot="active">⏸ 제외시간 시작</button>
  <button data-menu="resume" data-ot="excluded">▶ 복귀했어요</button>
  <button data-menu="finish" data-ot="active excluded">🏠 초과근무 종료</button>
  <hr>
  <button data-menu="hide">🙈 10초 숨기기</button>
</div>

<div class="taskbar">⊞ &nbsp; 🔍 &nbsp; 📁 &nbsp; 🌐 <span class="clock" id="clock"></span></div>

<script>
// ---------- 설정 ----------
let SIZE = 220;            // 펫 표시 크기(px), 사용자가 조절 가능
const SIZE_MIN = 100, SIZE_MAX = 360;
const FOOT = 0.95;         // 이미지 안에서 발끝의 세로 위치 비율
const GRAVITY = 2400;      // px/s^2
const BOUNCE = 0.62;       // 벽/바닥 반발 계수
const FRICTION = 0.86;     // 바닥에 닿을 때 수평 감속
const WALK_SPEED = 70;     // px/s
// 이미지별로 원본이 바라보는 방향 (망토가 뒤로 날리는 반대쪽이 진행 방향)
const FACES_LEFT = { runA: true, runB: true, fly: true };

const IMAGES = ['idle','blink','sleep','tired','research','runA','runB','curious','produce',
                'cheer','hello','farm','fly','think','alarm','best','surprise','angry'];
// 이미지가 HTML에 내장돼 있으면 그걸 쓰고, 없으면 img/ 폴더에서 읽음
const IMG = window.IMG_DATA || {};
const imgSrc = (n) => IMG[n] || `img/${n}.png`;
IMAGES.forEach(n => { const i = new Image(); i.src = imgSrc(n); });

const pet = document.getElementById('pet');
const img = document.getElementById('petImg');
const shadow = document.getElementById('shadow');
const bubble = document.getElementById('bubble');
const autoplay = document.getElementById('autoplay');

// ---------- 상태 ----------
const s = {
  x: innerWidth * 0.4, y: 0,     // 발끝 좌표
  vx: 0, vy: 0,
  mode: 'idle',                  // idle | walk | drag | fly | emote
  dir: 1,                        // 1 = 오른쪽, -1 = 왼쪽
  frame: 'idle',
  // 말랑 스프링 (scaleX/scaleY 변형)
  sq: 0, sqV: 0,                 // + 이면 납작, - 이면 길쭉
  tilt: 0, tiltV: 0, tiltTarget: 0,
  emoteUntil: 0, emoteName: null,
  nextAuto: performance.now() + 3000,
  nextBlink: performance.now() + 2500,
  blinkUntil: 0,
  walkUntil: 0,
  shake: 0,
  clicks: [],
};
const ground = () => innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h'));
s.y = ground();

function setFrame(name) {
  if (s.frame !== name) { s.frame = name; img.src = imgSrc(name); }
}
img.src = imgSrc('idle');
function poke(amount) { s.sqV += amount; }

// ---------- 말풍선 ----------
let bubbleTimer = null;
function say(html, { ms = 3500, alarm = false, choices = null } = {}) {
  bubble.innerHTML = html;
  bubble.className = alarm ? 'alarm' : '';
  bubble.style.display = 'block';
  if (choices) {
    const box = document.createElement('div');
    box.className = 'choices';
    choices.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c.label;
      if (c.secondary) b.className = 'secondary';
      b.onclick = (e) => { e.stopPropagation(); c.onClick(); };
      box.appendChild(b);
    });
    bubble.appendChild(box);
  }
  clearTimeout(bubbleTimer);
  if (ms) bubbleTimer = setTimeout(() => (bubble.style.display = 'none'), ms);
}
function hush() { bubble.style.display = 'none'; clearTimeout(bubbleTimer); }

// ---------- 감정 표현 ----------
function emote(name, ms, opts = {}) {
  if (s.mode === 'drag' || s.mode === 'fly') return;
  s.mode = 'emote';
  s.emoteName = name;
  s.emoteUntil = ms ? performance.now() + ms : Infinity;
  s.tiltTarget = 0;
  setFrame(opts.frame || name);
  if (opts.poke) poke(opts.poke);
}
function endEmote() {
  s.mode = 'idle'; s.emoteName = null; s.tiltTarget = 0; s.shake = 0;
  setFrame('idle');
  s.nextAuto = performance.now() + 2500 + Math.random() * 3000;
}

// 케어 메시지: [문구, 표정 이미지]
const CARE = [
  ['물 한 잔 마시고 올까요? 💧', 'hello'],
  ['잠깐 일어나서 기지개 쭉~ 🙆', 'cheer'],
  ['허리 쭉 펴고 앉아 볼까요?', 'best'],
  ['모니터에서 눈 떼고 먼 곳 20초 보기 👀', 'curious'],
  ['어깨 한 바퀴 돌려 볼까요?', 'hello'],
  ['소중한 연구 자료, 지식보관소에 차곡차곡 모아 주세요 📚', 'research'],
  ['…지켜보고 있다 👀', 'angry'],
  ['이번 주 랩미팅은 하셨나요?', 'think'],
  ['실험실 안전 점검, 오늘도 잘 챙기셨죠? 🧪', 'research'],
  ['퇴근 전에 책상 정리 한 번 할까요?', 'farm'],
  ['오늘 구내식당 메뉴는 뭘까요? 🍚', 'curious'],
  ['회의랑 출장 일정, 놓친 건 없으시죠? 📅', 'think'],
  ['오늘은 가족에게 안부 전화 한 통 어때요? 📞', 'hello'],
  ['옆자리 동료에게 "파이팅!" 한마디 건네 볼까요?', 'cheer'],
  ['커피 한 잔 하고 올까요? ☕', 'produce'],
];

const actions = {
  hello() { emote('hello', 2500, { poke: 3 }); s.tiltTarget = 0.12; say('안녕하세요! 오늘도 파이팅 🌾'); },
  cheer() { emote('cheer', 2600, { poke: 6 }); say('코인 +1 🪙 (보유 3/5)'); },
  care() {
    const [text, face] = CARE[Math.floor(Math.random() * CARE.length)];
    emote(face, 4000, { poke: 3 }); say(text, { ms: 4000 });
  },
  sleep() { emote('sleep', 6000); say('Zzz…', { ms: 6000 }); },
  curious() { emote('curious', 2500, { poke: 2 }); say('이건 뭐지…?'); },
  watch() { emote('angry', 3500, { poke: 2 }); say('…지켜보고 있다 👀'); },
  research() { emote('research', 4000, { poke: 2 }); },
  farm() { emote('farm', 4000, { poke: 2 }); },
  produce() { emote('produce', 4000, { poke: 3 }); say('수확 완료! 🥕'); },
  walk() { startWalk(); },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  hush(); if (s.mode === 'emote') endEmote(); actions[b.dataset.act]();
}));

function startWalk() {
  if (s.mode === 'drag' || s.mode === 'fly') return;
  s.mode = 'walk';
  s.dir = Math.random() < 0.5 ? -1 : 1;
  if (s.x < 200) s.dir = 1;
  if (s.x > innerWidth - 320) s.dir = -1;
  s.walkUntil = performance.now() + 2500 + Math.random() * 3500;
}

// ---------- 시뮬레이션 시계 (미리보기 전용: 실제 앱은 컴퓨터 시계 사용) ----------
const MIN = 60 * 1000;
const sim = { base: 0, realStart: performance.now(), speed: 1 };
const todayAt = (h, m) => { const d = new Date(simNow ? simNow() : Date.now()); d.setHours(h, m, 0, 0); return d.getTime(); };
function simNow() { return sim.base + (performance.now() - sim.realStart) * sim.speed; }
function setSimTime(ms) { sim.base = ms; sim.realStart = performance.now(); }
function setSpeed(x) { setSimTime(simNow()); sim.speed = x; }
sim.base = (() => { const d = new Date(); d.setHours(17, 50, 0, 0); return d.getTime(); })();
const fmt = (ms) => new Date(ms).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
const minuteOfDay = (ms) => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };

// ---------- 초과근무 로직 ----------
// 규칙: 기준 시각(마지막 근무확인) + 60분 = 마감, 마감 5·3·1분 전 알림, 지나면 초과 안내
// 일찍 눌러도 누른 시각이 새 기준, 제외시간 후 복귀하면 복귀 시각(근무확인 누른 시각)이 새 기준
const ASK_AT = 17 * 60 + 55;
const OT = { status: 'none', base: null, stage: 0, pendingPress: false, snoozeUntil: 0 };
// status: none(아직 안 물어봄) | asked(답 기다리는 중) | active | excluded | declined | done
const deadline = () => OT.base + 60 * MIN;
const bubbleBusy = () => bubble.style.display === 'block' && !!bubble.querySelector('.choices, input');

function otTick() {
  const t = simNow();
  if (OT.status === 'none' && minuteOfDay(t) >= ASK_AT && t >= OT.snoozeUntil) otAsk();
  if (OT.status !== 'active' || OT.pendingPress) return;   // 복귀 후 근무확인 전에는 예전 마감으로 울리지 않음
  const remain = deadline() - t;
  const stage = remain <= 0 ? 4 : remain <= MIN ? 3 : remain <= 3 * MIN ? 2 : remain <= 5 * MIN ? 1 : 0;
  if (stage > OT.stage) { OT.stage = stage; otAlarm(stage); }
}

function otAsk(greeting = '') {
  OT.status = 'asked';
  hush(); if (s.mode === 'emote') endEmote();
  emote('think', 0, { poke: 3 });
  say(`${greeting}오늘 초과 근무 하시나요?`, { ms: 0, choices: [
    { label: '예', onClick: otChooseBase },
    { label: '아니오', secondary: true, onClick: () => {
        OT.status = 'declined'; hush(); endEmote();

// 패널: 시계, 상태 표시, 시뮬레이션 버튼

// ---------- 드래그 & 던지기 ----------
let drag = null;
pet.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || resizing) return;          // 우클릭, 크기 조정 중에는 드래그 안 함
  pet.setPointerCapture(e.pointerId);
  drag = { startX: e.clientX, startY: e.clientY, offX: s.x - e.clientX, offY: s.y - e.clientY,
           moved: false, hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }] };
});
pet.addEventListener('pointermove', (e) => {
  if (!drag) {
    // 마우스로 문지르기: 버튼 안 누르고 빠르게 지나가면 살짝 출렁
    const sp = Math.hypot(e.movementX, e.movementY);
    if (sp > 6 && s.mode !== 'fly') { poke(Math.min(sp, 30) * 0.08); s.tiltV += e.movementX * 0.004; }
    return;
  }
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 6) {
    drag.moved = true;
    hush();
    s.mode = 'drag'; s.emoteName = null; s.shake = 0;
    setFrame('surprise');
    pet.classList.add('dragging');
  }
  if (drag.moved) {
    s.x = e.clientX + drag.offX; s.y = e.clientY + drag.offY;
    drag.hist.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (drag.hist.length > 6) drag.hist.shift();
  }
});
pet.addEventListener('pointerup', (e) => {
  if (!drag) return;
  pet.classList.remove('dragging');
  if (!drag.moved) {
    onClickPet();
  } else {
    const h = drag.hist, a = h[0], b = h[h.length - 1];
    const dt = Math.max((b.t - a.t) / 1000, 0.016);
    s.vx = (b.x - a.x) / dt; s.vy = (b.y - a.y) / dt;
    const max = 3200; const sp = Math.hypot(s.vx, s.vy);
    if (sp > max) { s.vx *= max / sp; s.vy *= max / sp; }
    s.mode = 'fly';
  }
  drag = null;
});

function onClickPet() {
  const now = performance.now();
  s.clicks = s.clicks.filter(t => now - t < 1500); s.clicks.push(now);
  poke(9);                                   // 푸딩처럼 탱!
  if (OT.status === 'excluded') { otResume(); return; }            // 제외시간 중 클릭 = 복귀
  if (OT.status === 'active' && (OT.stage > 0 || OT.pendingPress)) { // 알람 중 클릭 = 근무확인 완료
    otPressed(); return;
  }
  if (s.clicks.length >= 5) {                  // 연타하면 놀람
    s.clicks = [];
    emote('surprise', 1400, { poke: 6 }); say('으앗! 그만 눌러요~');
  } else if (s.mode === 'idle' || s.mode === 'walk') {
    if (s.mode === 'walk') s.mode = 'idle';
    setFrame('idle');
    s.nextAuto = now + 3000;
  }
}

// ---------- 크기 조절 ----------

}
// 초록 점 끌기: 발은 바닥에 고정된 채로, 오른쪽/위로 끌면 커지고 반대면 작아짐
const handle = pet.querySelector('.handle');
let hDrag = null;
handle.addEventListener('pointerdown', (e) => {

});

// ---------- 바탕화면 아이콘 충돌 (핀볼 범퍼) ----------
// 실제 앱에서는 윈도우 API로 읽은 아이콘 좌표를 같은 방식으로 사용
const bodyR = () => SIZE * 0.27;                  // 몸통을 원으로 근사
const iconEls = [...document.querySelectorAll('.icon')];
function bounceOffIcons() {
  const cx0 = s.x, cy0 = s.y - SIZE * 0.42;       // 몸통 중심
  for (const el of iconEls) {
    const r = el.getBoundingClientRect();
    const nx = Math.max(r.left, Math.min(cx0, r.right));
    const ny = Math.max(r.top, Math.min(cy0, r.bottom));
    let dx = cx0 - nx, dy = cy0 - ny;
    const dist = Math.hypot(dx, dy);
    const BODY_R = bodyR();
    if (dist >= BODY_R) continue;
    if (dist === 0) { dx = 0; dy = -1; } else { dx /= dist; dy /= dist; }
    // 겹친 만큼 밀어내기
    const push = BODY_R - (dist || 0);
    s.x += dx * push; s.y += dy * push;
    // 법선 방향으로 반사 (범퍼라서 살짝 더 세게)
    const vn = s.vx * dx + s.vy * dy;
    if (vn < 0) {
      s.vx -= 1.9 * vn * dx; s.vy -= 1.9 * vn * dy;
      poke(Math.min(Math.abs(vn) * 0.004, 0.35));
      s.tiltV += (dx > 0 ? 1 : -1) * 3;
      el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
    }
  }
}

// ---------- 메인 루프 ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  const G = ground();
  const L = SIZE * 0.32, R = innerWidth - SIZE * 0.32;   // 몸통 기준 좌우 경계

  if (s.mode === 'fly') {
    s.vy += GRAVITY * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x < L) { s.x = L; s.vx = -s.vx * BOUNCE; poke(Math.abs(s.vx) * 0.004); s.tiltV += 2; }
    if (s.x > R) { s.x = R; s.vx = -s.vx * BOUNCE; poke(Math.abs(s.vx) * 0.004); s.tiltV -= 2; }
    if (s.y < SIZE * 0.9) { s.y = SIZE * 0.9; s.vy = -s.vy * BOUNCE; poke(-Math.abs(s.vy) * 0.003); }
    bounceOffIcons();
    if (s.y >= G) {
      s.y = G;
      const impact = s.vy;
      poke(impact * 0.006);                    // 바닥에 닿으면 납작
      if (impact > 420) { s.vy = -impact * BOUNCE; s.vx *= FRICTION; }
      else { s.vy = 0; s.vx = 0; s.mode = 'idle'; setFrame(impact > 200 ? 'surprise' : 'idle');
             if (impact > 200) emote('surprise', 700); }
    }
    const sp = Math.hypot(s.vx, s.vy);
    if (s.mode === 'fly') {
      setFrame(sp > 350 ? 'fly' : 'surprise');
      if (Math.abs(s.vx) > 30) s.dir = s.vx > 0 ? 1 : -1;
      s.tiltTarget = s.frame === 'fly' ? Math.max(-0.5, Math.min(0.5, s.vy / 3000)) * s.dir : 0;
    }
  }

  if (s.mode === 'walk') {
    s.x += s.dir * WALK_SPEED * dt;
    if (s.x < L + 20) s.dir = 1;
    if (s.x > R - 20) s.dir = -1;
    const step = Math.floor(now / 170) % 2;
    setFrame(step ? 'runA' : 'runB');
    if (now > s.walkUntil) { s.mode = 'idle'; setFrame('idle'); s.nextAuto = now + 3000 + Math.random() * 3000; }
  }

  if (s.mode === 'emote' && now > s.emoteUntil) endEmote();
  otTick();

  // 대기 중 눈 깜빡임
  if (s.mode === 'idle') {
    if (now > s.nextBlink) { s.blinkUntil = now + 130; s.nextBlink = now + 2200 + Math.random() * 3500; }
    setFrame(now < s.blinkUntil ? 'blink' : 'idle');
  }

  // 자동 행동
  if (autoplay.checked && !resizing && !hidden && !bubbleBusy() && s.mode === 'idle' && now > s.nextAuto) {
    const r = Math.random();
    if (r < 0.55) startWalk();
    else if (r < 0.7) actions.research();
    else if (r < 0.8) actions.farm();
    else if (r < 0.88) actions.curious();
    else if (r < 0.95) actions.care();
    else actions.sleep();
    if (s.mode === 'idle') s.nextAuto = now + 4000;
  }

  // 말랑 스프링: 출렁이며 원래 모양으로
  const k = 260, damp = 9;
  s.sqV += (-k * s.sq - damp * s.sqV) * dt;
  s.sq += s.sqV * dt;
  s.sq = Math.max(-0.45, Math.min(0.45, s.sq));
  // 기울기 스프링
  let tiltGoal = s.tiltTarget;
  if (s.emoteName === 'sleep') tiltGoal = 0.12 + Math.sin(now / 900) * 0.1;          // 꾸벅꾸벅
  if (s.emoteName === 'hello') tiltGoal = Math.sin(now / 160) * 0.08;                  // 손 흔들며 흔들
  if (s.emoteName === 'think') tiltGoal = Math.sin(now / 700) * 0.07;                  // 갸우뚱
  s.tiltV += (-140 * (s.tilt - tiltGoal) - 10 * s.tiltV) * dt;
  s.tilt += s.tiltV * dt;

  // 걷기/감정별 통통 튀기
  let hop = 0;
  if (s.mode === 'walk') hop = Math.abs(Math.sin(now / 170 * Math.PI)) * 10;
  if (s.emoteName === 'cheer' || s.emoteName === 'best') hop = Math.abs(Math.sin(now / 200 * Math.PI)) * 26;
  if (s.emoteName === 'alarm') hop = Math.abs(Math.sin(now / 130 * Math.PI)) * 8;
  // 숨쉬기
  const breathe = (s.mode === 'idle' || s.mode === 'emote') ? Math.sin(now / 600) * 0.015 : 0;
  // 알람 흔들림
  const shakeX = s.shake ? Math.sin(now / 30) * 4 : 0;

  // 렌더링
  const sx = 1 + s.sq * 0.9 - breathe, sy = 1 - s.sq + breathe;
  const flip = (FACES_LEFT[s.frame] ? -s.dir : 1) * (s.frame === 'runA' || s.frame === 'runB' || s.frame === 'fly' ? 1 : 1);
  pet.style.transform = `translate(${s.x - SIZE / 2 + shakeX}px, ${s.y - SIZE * FOOT - hop}px)`;
  img.style.transform = `rotate(${s.tilt}rad) scale(${sx * flip}, ${sy})`;
  pet.style.zIndex = (s.emoteName === 'alarm' || bubble.style.display === 'block') ? 40 : 20;

  const height = Math.max(0, G - s.y + hop);
  const shScale = Math.max(0.35, 1 - height / 500);
  shadow.style.transform = `translate(${s.x - SIZE * 0.275}px, ${G - SIZE * 0.04}px) scale(${shScale * (1 + s.sq * 0.6)}, ${shScale})`;
  shadow.style.opacity = shScale;

  if (bubble.style.display === 'block') {
    bubble.style.left = `${Math.max(140, Math.min(innerWidth - 140, s.x))}px`;
    bubble.style.top = `${s.y - SIZE * 0.92 - hop}px`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// 시계
function clock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
clock(); setInterval(clock, 10000);

// 시작 인사
setTimeout(() => actions.hello(), 600);
</script>
