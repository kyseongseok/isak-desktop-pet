# 윈도우용 설치 파일 자동 빌드
# - 태그(v*)를 푸시하면 GitHub 서버에서 설치 exe를 만들어 같은 이름의 Release에 첨부합니다.
# - Actions 탭에서 "Run workflow"로 직접 돌리면 Artifacts에서 받을 수 있습니다.
name: build-win
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:win -- --publish never   # electron-builder의 자체 GitHub 배포는 끄고(토큰 없음), 첨부는 아래 단계에서
      - uses: actions/upload-artifact@v4
        with:
          name: isak-pet-win
          path: dist/*.exe
      # GitHub Release는 첨부 파일 이름에서 한글을 지워 버리므로 영문 이름으로 복사해서 붙임 (설치하면 "이삭이"로 표시됨)
      - name: 영문 이름으로 복사
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName "dist\IsakPet-Setup-$ver.exe"
      - name: Release에 설치 파일 첨부 (태그 푸시일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IsakPet-Setup-*.exe
          fail_on_unmatched_files: true
