# 윈도우용 설치 파일 자동 빌드
# - 태그(v*)를 푸시하면 GitHub 서버에서 설치 exe를 만들어 같은 이름의 Release에 첨부합니다.
# - Actions 탭에서 "Run workflow"로 직접 돌리면 Artifacts에서 받을 수 있습니다.
name: build-win
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: isak-pet-win
          path: dist/*.exe
      - name: Release에 설치 파일 첨부 (태그 푸시일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
